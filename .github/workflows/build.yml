name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: artifacts/example.xls

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: ./scripts/publish.ps1
        shell: pwsh
      - run: ./scripts/smoke-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SolarReport-win-x64
          path: artifacts/SolarReport-win-x64.zip
